<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VENUN - Scanner Caméra Live</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, sans-serif; user-select: none; }
        body { background-color: #0d0d0f; color: #e0e0e0; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }
        :root { --bg-color: #121215; --purple-accent: #8b5cf6; --copper-accent: #d97706; --shadow-dark: #09090b; --shadow-light: #1b1b1f; }
        .scanner-card { width: 100%; max-width: 400px; background: var(--bg-color); border-radius: 28px; padding: 20px; box-shadow: 8px 8px 18px var(--shadow-dark), -8px -8px 18px var(--shadow-light); border: 1px solid rgba(255, 255, 255, 0.03); display: flex; flex-direction: column; gap: 16px; }
        .header { text-align: center; }
        .brand-title { font-size: 22px; font-weight: 900; letter-spacing: 2px; background: linear-gradient(135deg, #ffffff, var(--copper-accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .viewport-container { 
            width: 100%; 
            height: 320px; /* Hauteur fixe pour le conteneur */
            background: #000; 
            border-radius: 18px; 
            position: relative; 
            overflow: hidden; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            box-shadow: inset 3px 3px 8px var(--shadow-dark), inset -3px -3px 8px var(--shadow-light); 
        }

        #video-element { display: none; }
        /* Le canvas s'adapte à la taille du conteneur tout en gardant son ratio */
        #debug-canvas { width: 100%; height: 100%; object-fit: cover; }

        .actions-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .neu-btn { background: var(--bg-color); border: none; border-radius: 14px; box-shadow: 4px 4px 10px var(--shadow-dark), -4px -4px 10px var(--shadow-light); color: #fff; padding: 12px; font-weight: 600; font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .neu-btn:active { box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light); color: var(--purple-accent); }
        #gallery-input { display: none; }

        .result-box { background: var(--bg-color); border-radius: 16px; padding: 16px; box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light); text-align: center; }
        .result-label { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
        .result-value { font-size: 22px; font-weight: 800; color: var(--purple-accent); letter-spacing: 2px; }
    </style>
</head>
<body>

<div class="scanner-card">
    <div class="header">
        <div class="brand-title">VENUN POS SCANNER</div>
    </div>

    <div class="viewport-container" id="viewport">
        <video id="video-element" playsinline autoplay></video>
        <canvas id="debug-canvas"></canvas>
    </div>

    <div class="actions-grid">
        <button class="neu-btn" onclick="startCamera()">📸 Caméra</button>
        <button class="neu-btn" onclick="triggerGallery()">📁 Galerie</button>
    </div>

    <div class="actions-grid" style="margin-top: -8px;">
        <button class="neu-btn" style="color: var(--purple-accent); grid-column: span 2;" onclick="generateTestImage()">🎨 Test Image</button>
    </div>

    <input type="file" id="gallery-input" accept="image/*" onchange="handleImageUpload(event)">

    <div class="result-box">
        <div class="result-label">ID Détecté (Série AA)</div>
        <div class="result-value" id="card-id-result">EN ATTENTE...</div>
    </div>
</div>

<script>
    const video = document.getElementById('video-element');
    const canvas = document.getElementById('debug-canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const resultDisplay = document.getElementById('card-id-result');
    const viewport = document.getElementById('viewport');
    
    let isScanningLive = false;
    let animationFrameId = null;
    let isTestMode = false;

    function triggerGallery() {
        stopCamera();
        document.getElementById('gallery-input').click();
    }

    async function startCamera() {
        stopCamera();
        isTestMode = false;
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: { exact: "environment" } }
            }).catch(() => navigator.mediaDevices.getUserMedia({ video: true }));

            video.srcObject = stream;
            await video.play();
            
            // Ajuster la taille interne du canvas à la résolution vidéo
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            
            isScanningLive = true;
            requestAnimationFrame(processLiveCamera);
        } catch (err) {
            alert("Impossible d'accéder à la caméra : " + err.message);
        }
    }

    function stopCamera() {
        isScanningLive = false;
        if (animationFrameId) cancelAnimationFrame(animationFrameId);
        if (video.srcObject) {
            video.srcObject.getTracks().forEach(track => track.stop());
            video.srcObject = null;
        }
    }

    function isPurpleHSV(r, g, b) {
        r /= 255; g /= 255; b /= 255;
        const max = Math.max(r, g, b), min = Math.min(r, g, b);
        const d = max - min;
        if (max === min || d === 0) return false;

        let h;
        if (max === r) h = (g - b) / d + (g < b ? 6 : 0);
        else if (max === g) h = (b - r) / d + 2;
        else if (max === b) h = (r - g) / d + 4;
        h /= 6;

        const hueDegrees = h * 360;
        const saturation = max === 0 ? 0 : d / max;
        // Ajustement mineur de la saturation pour être plus tolérant avec l'éclairage de la caméra
        return (hueDegrees >= 240 && hueDegrees <= 330 && saturation > 0.15);
    }

    function processLiveCamera() {
        if (!isScanningLive) return;

        if (video.readyState === video.HAVE_ENOUGH_DATA) {
            // S'assurer que le canvas a la bonne taille
            if (canvas.width !== video.videoWidth || canvas.height !== video.videoHeight) {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
            }
            
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            analyzeSquareRegion();
        }

        animationFrameId = requestAnimationFrame(processLiveCamera);
    }

    function handleImageUpload(event) {
        isTestMode = true;
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.src = e.target.result;
                img.onload = () => {
                    canvas.width = img.width;
                    canvas.height = img.height;
                    ctx.drawImage(img, 0, 0);
                    analyzeSquareRegion();
                };
            };
            reader.readAsDataURL(file);
        }
    }

    function generateTestImage() {
        stopCamera();
        isTestMode = true;
        
        // Créer une image de test parfaitement carrée
        canvas.width = 400;
        canvas.height = 400;
        
        ctx.fillStyle = "#FFFFFF";
        ctx.fillRect(0, 0, 400, 400);

        const targetID = [2, 3, 7, 5, 5, 0, 9, 4, 6, 5];
        const step = 400 / 10;

        for (let row = 0; row < 10; row++) {
            for (let col = 0; col < 10; col++) {
                const x = col * step + step / 2;
                const y = row * step + step / 2;
                ctx.beginPath();
                ctx.arc(x, y, 8, 0, Math.PI * 2);
                ctx.fillStyle = (col === targetID[row]) ? "#8b5cf6" : "#9ca3af";
                ctx.fill();
            }
        }
        
        analyzeSquareRegion();
    }

    // NOUVELLE FONCTION : Analyse uniquement un carré parfait au centre de l'image
    function analyzeSquareRegion() {
        const w = canvas.width;
        const h = canvas.height;
        if (w === 0 || h === 0) return;

        // 1. Définir le carré d'analyse (Region of Interest)
        // Prendre la plus petite dimension pour faire un carré parfait
        let size = Math.min(w, h);
        
        // En mode caméra, on réduit un peu le carré (ex: 80% de la taille dispo) 
        // pour laisser une marge et aider l'utilisateur à viser
        if (!isTestMode) {
            size = size * 0.8; 
        }

        // Calculer les coordonnées du coin supérieur gauche pour centrer le carré
        const startX = (w - size) / 2;
        const startY = (h - size) / 2;

        // Dessiner le cadre de visée
        ctx.strokeStyle = "#EF4444"; // Rouge global
        ctx.lineWidth = 4;
        ctx.strokeRect(startX, startY, size, size);

        // Assombrir l'extérieur du carré pour guider l'utilisateur
        if (!isTestMode) {
            ctx.fillStyle = "rgba(0, 0, 0, 0.5)";
            ctx.fillRect(0, 0, w, startY); // Haut
            ctx.fillRect(0, startY + size, w, h - (startY + size)); // Bas
            ctx.fillRect(0, startY, startX, size); // Gauche
            ctx.fillRect(startX + size, startY, w - (startX + size), size); // Droite
        }

        // 2. Extraire uniquement les données de ce carré
        const imgData = ctx.getImageData(startX, startY, size, size);
        const data = imgData.data;

        // 3. Analyser la grille 10x10 à l'intérieur de ce carré
        const cellWidth = size / 10;
        const cellHeight = size / 10; // cellHeight = cellWidth puisque c'est un carré parfait
        let detectedDigits = [];

        for (let row = 0; row < 10; row++) {
            let bestCol = 0;
            let maxPurpleCount = -1;

            for (let col = 0; col < 10; col++) {
                // Coordonnées relatives au carré extrait
                const cellStartX = Math.floor(col * cellWidth);
                const cellStartY = Math.floor(row * cellHeight);

                // Dessiner le quadrillage (coordonnées absolues sur le canvas principal)
                ctx.strokeStyle = "rgba(59, 130, 246, 0.6)"; // Bleu
                ctx.lineWidth = 1;
                ctx.strokeRect(startX + cellStartX, startY + cellStartY, cellWidth, cellHeight);

                let purplePixels = 0;
                // Scanner la cellule
                for (let y = cellStartY; y < cellStartY + cellHeight; y += 3) {
                    for (let x = cellStartX; x < cellStartX + cellWidth; x += 3) {
                        // Index dans le tableau de pixels (relatif au carré)
                        const idx = (Math.floor(y) * Math.floor(size) + Math.floor(x)) * 4;
                        if (isPurpleHSV(data[idx], data[idx+1], data[idx+2])) {
                            purplePixels++;
                        }
                    }
                }

                if (purplePixels > maxPurpleCount) {
                    maxPurpleCount = purplePixels;
                    bestCol = col;
                }
            }
            detectedDigits.push(bestCol);
        }

        resultDisplay.innerText = `AA-${detectedDigits.join('')}`;
    }
</script>

</body>
</html>
